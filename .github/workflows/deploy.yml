name: Deploy QuantNova AI

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            cd /var/www/QuantNova-AI-Website
            git pull origin master
            npm install
            npm run build
            rm -rf /var/www/quantnova/*
            cp -r dist/* /var/www/quantnova/
